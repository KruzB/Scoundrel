<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoundrel: Dungeon Crawler RPG (Full Expanded Edition)</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #3182ce;
      --enemy-color: #e53e3e;
      --weapon-color: #d69e2e;
      --potion-color: #38a169;
      --curse-color: #805ad5;
      --shop-color: #ecc94b;
      --cheat-color: #e53e3e;
      --cloud-color: #4299e1;
      --treasure-color: #ed8936;
      --boss-color: #ff0055;
      --border-color: #333;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header-bar {
      width: 100%;
      max-width: 650px;
      max-width: 650px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    @media (min-width: 550px) {
      .stats-panel { grid-template-columns: repeat(6, 1fr); }
    }

    .stat-box { text-align: center; }
    .stat-label { font-size: 10px; opacity: 0.7; text-transform: uppercase; }
    .stat-value { font-size: 13px; font-weight: bold; margin-top: 2px; }

    .dungeon-grid {
      width: 100%;
      max-width: 650px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 400px) {
      .dungeon-grid { grid-template-columns: 1fr; }
    }

    .encounter-node {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 14px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.2s, border-color 0.2s;
    }

    .encounter-node:hover { transform: translateY(-2px); }
    .node-enemy { border-color: var(--enemy-color); }
    .node-weapon { border-color: var(--weapon-color); }
    .node-shrine { border-color: var(--potion-color); }
    .node-curse { border-color: var(--curse-color); }
    .node-shop { border-color: var(--shop-color); }
    .node-treasure { border-color: var(--treasure-color); }
    .node-boss { border-color: var(--boss-color); background: #2a0813; }

    .node-title { font-size: 15px; font-weight: bold; }
    .node-desc { font-size: 12px; opacity: 0.8; margin-top: 4px; }

    .controls { display: flex; gap: 8px; margin-bottom: 16px; width: 100%; max-width: 650px; }
    .controls .btn { flex: 1; padding: 12px; }

    .class-select {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      width: 100%;
      max-width: 650px;
    <h2 id="game-title" title="Click 5 times for Secret Code">Dungeon Scoundrel</h2>
    <div style="display: flex; gap: 6px;">
      <button class="btn btn-leaderboard" id="open-leaderboard-btn">Leaderboard</button>
      <button class="btn btn-cloud" id="open-cloud-btn">Cloud Sync</button>
    </div>
  </div>

  <div class="class-select">
    <label for="hero-class" style="font-size: 13px;">Hero: </label>
    <select id="hero-class">
      <option value="Knight">Knight (+5 HP, Shield Heals +6)</option>
      <option value="Rogue">Rogue (+10 Starting Gold, 2 Retreats)</option>
      <option value="Sorcerer">Sorcerer (Dispels Cursed Fountains)</option>
      <option value="Necromancer">Necromancer (Siphons 5 HP)</option>
      <option value="Paladin">Paladin (+2 Armor, Holy Shield)</option>
      <option value="Berserker">Berserker (Rage Blast Clears Node)</option>
    </select>
    <button class="btn" id="start-btn">New Run</button>
  </div>

  <div class="stats-panel">
    <div class="stat-box"><div class="stat-label">Health</div><div class="stat-value" id="hp-val">20 / 20</div></div>
    <div class="stat-box"><div class="stat-label">Level / XP</div><div class="stat-value" id="xp-val">Lvl 1 (0/10)</div></div>
    <div class="stat-box"><div class="stat-label">Gold</div><div class="stat-value" id="gold-val">0</div></div>
    <div class="stat-box"><div class="stat-label">Armor / Weapon</div><div class="stat-value" id="weapon-val">0 Arm / Unarmed</div></div>
    <div class="stat-box"><div class="stat-label">Wave / Mode</div><div class="stat-value" id="floor-val">1 / Standard</div></div>
    <div class="stat-box"><div class="stat-label">Skill</div><div class="stat-value" id="skill-val">Ready</div></div>
  </div>

  <div class="dungeon-grid" id="dungeon-room"></div>

  <div class="controls">
    <button class="btn" id="run-btn">Retreat to Next Room</button>
    <button class="btn" id="ability-btn">Use Skill</button>
  </div>

  <!-- Cloud Save Modal -->
  <div class="modal-overlay" id="cloud-modal">
    <div class="modal-content cloud-modal-content">
      <div class="modal-header" style="color: var(--cloud-color)">Cloud Save Sync</div>
      
      <div class="cloud-box">
        <div style="font-size: 13px; opacity: 0.8;">Upload Save to Cloud:</div>
        <button class="btn btn-cloud" style="margin-top: 8px; width: 100%;" onclick="uploadCloudSave()">Save to Cloud & Get Code</button>
        <div id="cloud-code-result" class="cloud-code-display">------</div>
      </div>

      <div class="cloud-box">
        <div style="font-size: 13px; opacity: 0.8; margin-bottom: 8px;">Load Cloud Save:</div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="cloud-code-input" placeholder="Enter 6-Digit Code" maxlength="6" style="text-transform: uppercase;">
          <button class="btn btn-cloud" onclick="downloadCloudSave()">Load Save</button>
        </div>
      </div>

      <div id="cloud-status-msg" style="font-size: 13px; color: #a0aec0; min-height: 18px; text-align: center;"></div>

      <div style="margin-top: 16px; text-align: right;">
        <button class="btn" style="background: #4a5568;" id="close-cloud-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div class="modal-overlay" id="leaderboard-modal">
    <div class="modal-content leaderboard-modal-content">
      <div class="modal-header" style="color: #805ad5;">Global Highscores</div>
      <div class="leaderboard-list" id="leaderboard-container">
        <div style="text-align:center; padding: 12px; color: #a0aec0;">Loading leaderboard...</div>
      </div>
      <div style="margin-top: 16px; text-align: right;">
        <button class="btn" style="background: #4a5568;" id="close-leaderboard-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Shop Modal -->
  <div class="modal-overlay" id="shop-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Post-Boss Merchant</span>
        <span id="shop-gold">Gold: 0</span>
      </div>
      <div class="shop-item">
        <div><div>Health Potion</div><div style="font-size: 12px; opacity: 0.7;">Restores +8 HP</div></div>
        <button class="btn" onclick="buyItem('potion', 12)">12 Gold</button>
      </div>
      <div class="shop-item">
        <div><div>Whetstone</div><div style="font-size: 12px; opacity: 0.7;">+3 Weapon Durability</div></div>
        <button class="btn" onclick="buyItem('whetstone', 10)">10 Gold</button>
      </div>
      <div class="shop-item">
        <div><div>Iron Armor</div><div style="font-size: 12px; opacity: 0.7;">+2 Armor</div></div>
        <button class="btn" onclick="buyItem('armor', 25)">25 Gold</button>
      </div>
      <div style="margin-top: 16px; text-align: right;">
        <button class="btn" style="background: #e53e3e;" id="close-shop-btn">Continue Run</button>
      </div>
    </div>
  </div>

  <!-- Level Up Modal -->
  <div class="modal-overlay" id="levelup-modal">
    <div class="modal-content" style="border-color: #38a169;">
      <div class="modal-header" style="color: #38a169;">LEVEL UP! Choose Reward</div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 12px;">
        <button class="btn" style="padding: 12px; background: #2f855a;" onclick="chooseLevelReward('hp')">+5 Max Health & Full Heal</button>
        <button class="btn" style="padding: 12px; background: #2b6cb0;" onclick="chooseLevelReward('armor')">+2 Permanent Armor</button>
        <button class="btn" style="padding: 12px; background: #d69e2e;" onclick="chooseLevelReward('gold')">+30 Bonus Gold</button>
      </div>
    </div>
  </div>

  <!-- Secret Cheat Modal -->
  <div class="modal-overlay" id="cheat-modal">
    <div class="modal-content cheat-modal-content">
      <div class="modal-header cheat-header">
        <span>Secret Cheat Menu</span>
        <span id="godmode-indicator" style="font-size: 12px; color: #38a169;"></span>
      </div>
      <div class="shop-item"><div>Treasury Boost (+50 Gold)</div><button class="btn" onclick="cheatAddGold()">Add</button></div>
      <div class="shop-item"><div>Divine Healer (Full Heal)</div><button class="btn" onclick="cheatFullHeal()">Heal</button></div>
      <div class="shop-item"><div>God Blade (Excalibur)</div><button class="btn" onclick="cheatSpawnWeapon()">Spawn</button></div>
      <div class="shop-item"><div>God Mode</div><button class="btn" onclick="cheatToggleGodMode()">Toggle</button></div>
      <div class="shop-item"><div>Skip Wave</div><button class="btn" onclick="cheatSkipFloor()">Skip</button></div>
      <div style="margin-top: 16px; text-align: right;">
        <button class="btn" style="background: #4a5568;" id="close-cheat-btn">Close</button>
      </div>
    </div>
  </div>

  <script>
    // --- Firebase Config ---
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyForPublicLeaderboardSync01",
      authDomain: "dungeon-scoundrel-demo.firebaseapp.com",
      projectId: "dungeon-scoundrel-demo",
      storageBucket: "dungeon-scoundrel-demo.appspot.com",
      messagingSenderId: "100000000000",
      appId: "1:100000000000:web:abcdef123456"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- Core State Variables ---
    let health = 20, maxHealth = 20, level = 1, xp = 0, xpToNext = 10;
    let gold = 0, armor = 0, currentFloor = 1, isEndless = false;
    let equippedWeapon = null, roomEncounters = [], heroClass = "Knight";
    let skillUsed = false, retreatCount = 0, maxRetreats = 1, godMode = false;

    // Doubled Content Rosters
    const enemyTypes = [
      { name: "Goblin", baseDmg: 3, xp: 4, dropChance: 0.6, gold: 5 },
      { name: "Giant Spider", baseDmg: 4, xp: 5, dropChance: 0.65, gold: 7 },
      { name: "Skeleton Fighter", baseDmg: 5, xp: 6, dropChance: 0.7, gold: 9 },
      { name: "Necromancer Cultist", baseDmg: 7, xp: 8, dropChance: 0.75, gold: 12 },
      { name: "Orc Warrior", baseDmg: 8, xp: 10, dropChance: 0.8, gold: 15 },
      { name: "Shadow Assassin", baseDmg: 10, xp: 12, dropChance: 0.85, gold: 18 },
      { name: "Dungeon Guard", baseDmg: 11, xp: 14, dropChance: 0.88, gold: 20 },
      { name: "Demon Knight", baseDmg: 13, xp: 17, dropChance: 0.90, gold: 24 },
      { name: "Minotaur", baseDmg: 14, xp: 20, dropChance: 0.93, gold: 28 },
      { name: "Dungeon Lich", baseDmg: 16, xp: 25, dropChance: 0.96, gold: 35 }
    ];

    const weaponTypes = [
      { name: "Iron Dagger", power: 3, durability: 3 },
      { name: "Shadow Dagger", power: 4, durability: 4 },
      { name: "Broadsword", power: 6, durability: 4 },
      { name: "Flanged Mace", power: 7, durability: 3 },
      { name: "Battle Axe", power: 9, durability: 3 },
      { name: "Greatsword", power: 10, durability: 3 },
      { name: "Warhammer", power: 12, durability: 2 },
      { name: "Halberd", power: 14, durability: 2 }
    ];

    function initGame() {
      heroClass = document.getElementById("hero-class").value;
      maxHealth = heroClass === "Knight" ? 25 : (heroClass === "Paladin" ? 22 : 20);
      health = maxHealth; level = 1; xp = 0; xpToNext = 10;
      gold = heroClass === "Rogue" ? 10 : 0;
      armor = heroClass === "Paladin" ? 2 : 0;
      currentFloor = 1; isEndless = false;
      equippedWeapon = null; skillUsed = false;
      retreatCount = 0; maxRetreats = heroClass === "Rogue" ? 2 : 1;
      godMode = false;

      generateRoom(); updateUI(); saveState();
    }

    function generateRoom() {
      roomEncounters = [];
      if (currentFloor % 5 === 0) {
        roomEncounters.push({
          type: "Boss",
          title: `Wave ${currentFloor} Boss`,
          value: 12 + Math.floor(currentFloor * 2.5),
          xpReward: 25 + currentFloor * 5,
          goldReward: currentFloor * 15,
          nodeClass: "node-boss"
        });
        return;
      }

      for (let i = 0; i < 4; i++) {
        roomEncounters.push(createRandomEncounter());
      }
    }

    function createRandomEncounter() {
      const rand = Math.random();
      if (rand < 0.35) {
        const enemyIdx = Math.min(Math.floor(Math.random() * (1 + currentFloor / 2)), enemyTypes.length - 1);
        const t = enemyTypes[enemyIdx];
        return {
          type: "Enemy", title: t.name, value: t.baseDmg + Math.floor(currentFloor / 3),
          xpReward: t.xp, dropChance: t.dropChance, goldReward: t.gold, nodeClass: "node-enemy"
        };
      } else if (rand < 0.50) {
        const wIdx = Math.min(Math.floor(Math.random() * (1 + currentFloor / 3)), weaponTypes.length - 1);
        const w = weaponTypes[wIdx];
        return { type: "Weapon", title: w.name, power: w.power, durability: w.durability, nodeClass: "node-weapon" };
      } else if (rand < 0.62) {
        return { type: "Shrine", title: "Healing Shrine", value: 4 + Math.floor(Math.random() * 5), nodeClass: "node-shrine" };
      } else if (rand < 0.72) {
        return { type: "Fountain", title: "Fountain of Youth", value: maxHealth, nodeClass: "node-shrine" };
      } else if (rand < 0.80) {
        return { type: "Treasure", title: "Treasure Chest", goldReward: 15 + Math.floor(Math.random() * 15), nodeClass: "node-treasure" };
      } else if (rand < 0.86) {
        return { type: "Armory", title: "Armory Vault", armorBoost: 2, nodeClass: "node-weapon" };
      } else if (rand < 0.93) {
        return { type: "Curse", title: "Cursed Fountain", value: 3 + Math.floor(Math.random() * 4), goldReward: 10, nodeClass: "node-curse" };
      } else {
        return { type: "Mimic", title: "Mimic Trap!", value: 6, goldReward: 20, nodeClass: "node-curse" };
      }
    }

    function interact(index) {
      const enc = roomEncounters[index];

      if (enc.type === "Shrine") {
        health = Math.min(maxHealth, health + enc.value);
      } else if (enc.type === "Fountain") {
        health = maxHealth;
      } else if (enc.type === "Treasure") {
        gold += enc.goldReward;
      } else if (enc.type === "Armory") {
        armor += enc.armorBoost;
      } else if (enc.type === "Curse" || enc.type === "Mimic") {
        if (!godMode) {
          let taken = Math.max(0, enc.value - armor);
          health -= taken;
          if (taken > 0) triggerHitAnimation();
        }
        gold += enc.goldReward;
      } else if (enc.type === "Weapon") {
        equippedWeapon = { name: enc.title, power: enc.power, durability: enc.durability };
      } else if (enc.type === "Enemy" || enc.type === "Boss") {
        handleCombat(enc);
      }

      roomEncounters.splice(index, 1);

      if (roomEncounters.length === 0 || enc.type === "Boss") {
        if (enc.type === "Boss") {
          openShop();
          return;
        }
        advanceFloor();
      }

      updateUI(); saveState(); checkDeath();
    }

    function handleCombat(enc) {
      if (!godMode) {
        let rawDmg = Math.max(0, enc.value - armor);
        if (equippedWeapon && equippedWeapon.durability > 0) {
          let actualDmg = Math.max(0, rawDmg - equippedWeapon.power);
          health -= actualDmg;
          equippedWeapon.durability -= 1;
          if (equippedWeapon.durability <= 0) equippedWeapon = null;
          if (actualDmg > 0) triggerHitAnimation();
        } else {
          health -= rawDmg;
          triggerHitAnimation();
        }
      }

      addXP(enc.xpReward || 5);

      if (enc.type === "Boss") {
        gold += enc.goldReward;
      } else if (Math.random() < enc.dropChance) {
        gold += enc.goldReward;
      }
    }

    function addXP(amount) {
      xp += amount;
      if (xp >= xpToNext) {
        xp -= xpToNext;
        level++;
        xpToNext = Math.floor(xpToNext * 1.5);
        document.getElementById("levelup-modal").style.display = "flex";
      }
    }

    function chooseLevelReward(type) {
      if (type === 'hp') { maxHealth += 5; health = maxHealth; }
      else if (type === 'armor') { armor += 2; }
      else if (type === 'gold') { gold += 30; }
      document.getElementById("levelup-modal").style.display = "none";
      updateUI(); saveState();
    }

    function advanceFloor() {
      if (currentFloor === 20 && !isEndless) {
        let cont = confirm("VICTORY! You beat Wave 20! Do you want to continue into Endless Mode?");
        if (cont) {
          isEndless = true;
          currentFloor++;
          generateRoom();
        } else {
          submitScore();
          initGame();
        }
      } else {
        currentFloor++;
        generateRoom();
      }
    }

    // --- Firebase Cloud Sync ---
    async function uploadCloudSave() {
      const status = document.getElementById("cloud-status-msg");
      status.innerText = "Syncing with cloud...";
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();

      const payload = {
        health, maxHealth, level, xp, xpToNext, gold, armor, currentFloor, isEndless, equippedWeapon, roomEncounters, heroClass, skillUsed, retreatCount, godMode
      };

      try {
        await db.collection("cloud_saves").doc(code).set(payload);
        document.getElementById("cloud-code-result").innerText = code;
        status.innerText = "Cloud save successfully stored!";
      } catch (e) {
        status.innerText = "Error uploading save. Try again.";
      }
    }

    async function downloadCloudSave() {
      const code = document.getElementById("cloud-code-input").value.trim().toUpperCase();
      const status = document.getElementById("cloud-status-msg");
      if (!code) return;

      status.innerText = "Loading save...";
      try {
        const doc = await db.collection("cloud_saves").doc(code).get();
        if (doc.exists) {
          const s = doc.data();
          health = s.health; maxHealth = s.maxHealth; level = s.level; xp = s.xp;
          xpToNext = s.xpToNext; gold = s.gold; armor = s.armor; currentFloor = s.currentFloor;
          isEndless = s.isEndless; equippedWeapon = s.equippedWeapon; roomEncounters = s.roomEncounters;
          heroClass = s.heroClass; skillUsed = s.skillUsed; retreatCount = s.retreatCount; godMode = s.godMode;
          
          document.getElementById("hero-class").value = heroClass;
          updateUI(); saveState();
          status.innerText = "Cloud save loaded!";
        } else {
          status.innerText = "Invalid Cloud Code!";
        }
      } catch (e) {
        status.innerText = "Error retrieving cloud save.";
      }
    }

    // --- Leaderboard Sync ---
    async function submitScore() {
      const name = prompt("Enter your hero name for the Leaderboard:", "Scoundrel");
      if (!name) return;
      try {
        await db.collection("highscores").add({
          name: name.slice(0, 15),
          wave: currentFloor,
          level: level,
          gold: gold,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        openLeaderboard();
      } catch(e) {}
    }

    async function openLeaderboard() {
      const container = document.getElementById("leaderboard-container");
      document.getElementById("leaderboard-modal").style.display = "flex";
      container.innerHTML = `<div style="text-align:center; padding: 12px; color: #a0aec0;">Fetching top scores...</div>`;

      try {
        const snap = await db.collection("highscores").orderBy("wave", "desc").limit(10).get();
        container.innerHTML = "";
        snap.forEach((doc, i) => {
          const d = doc.data();
          container.innerHTML += `
            <div class="leaderboard-row">
              <span>#${i+1} <b>${d.name}</b></span>
              <span>Wave ${d.wave} (Lvl ${d.level})</span>
            </div>
          `;
        });
      } catch (e) {
        container.innerHTML = `<div style="text-align:center; color: #e53e3e;">Failed to load leaderboard.</div>`;
      }
    }

    // --- Class Skill Abilities ---
    function useSkill() {
      if (skillUsed) return;

      if (heroClass === "Sorcerer") {
        roomEncounters = roomEncounters.filter(e => e.type !== "Curse");
        while (roomEncounters.length < 4) roomEncounters.push(createRandomEncounter());
        skillUsed = true;
      } else if (heroClass === "Knight") {
        health = Math.min(maxHealth, health + 6);
        skillUsed = true;
      } else if (heroClass === "Necromancer") {
        health = Math.min(maxHealth, health + 5);
        gold += 5;
        skillUsed = true;
      } else if (heroClass === "Paladin") {
        armor += 3;
        health = Math.min(maxHealth, health + 3);
        skillUsed = true;
      } else if (heroClass === "Berserker") {
        if (roomEncounters.length > 1) {
          roomEncounters.pop();
          skillUsed = true;
        }
      }

      updateUI(); saveState();
    }

    function retreat() {
      if (retreatCount >= maxRetreats || roomEncounters.length < 4) return;
      retreatCount++;
      generateRoom();
      updateUI(); saveState();
    }

    function openShop() {
      document.getElementById("shop-gold").innerText = `Gold: ${gold}`;
      document.getElementById("shop-modal").style.display = "flex";
    }

    function closeShop() {
      document.getElementById("shop-modal").style.display = "none";
      advanceFloor();
      updateUI(); saveState();
    }

    function buyItem(type, cost) {
      if (gold < cost) return alert("Not enough gold!");
      if (type === 'potion') { health = Math.min(maxHealth, health + 8); gold -= cost; }
      else if (type === 'whetstone' && equippedWeapon) { equippedWeapon.durability += 3; gold -= cost; }
      else if (type === 'armor') { armor += 2; gold -= cost; }
      document.getElementById("shop-gold").innerText = `Gold: ${gold}`;
      updateUI(); saveState();
    }

    // --- Secret Cheat Code ---
    let titleClickCount = 0;
    document.getElementById("game-title").addEventListener("click", () => {
      titleClickCount++;
      if (titleClickCount >= 5) {
        titleClickCount = 0;
        const code = prompt("Enter Secret Code:");
        if (code === "1337" || code === "cheat") document.getElementById("cheat-modal").style.display = "flex";
      }
    });

    function cheatAddGold() { gold += 50; updateUI(); saveState(); }
    function cheatFullHeal() { health = maxHealth; updateUI(); saveState(); }
    function cheatSpawnWeapon() { equippedWeapon = { name: "Excalibur", power: 20, durability: 10 }; updateUI(); saveState(); }
    function cheatToggleGodMode() { godMode = !godMode; updateUI(); saveState(); }
    function cheatSkipFloor() { currentFloor++; generateRoom(); updateUI(); saveState(); }

    function triggerHitAnimation() {
      document.body.classList.add("damage-anim");
      setTimeout(() => document.body.classList.remove("damage-anim"), 250);
    }

    function checkDeath() {
      if (health <= 0) {
        alert(`You fell on Wave ${currentFloor}.`);
        submitScore();
        initGame();
      }
    }

    function updateUI() {
      document.getElementById("hp-val").innerText = `${health} / ${maxHealth}` + (godMode ? " (GOD)" : "");
      document.getElementById("xp-val").innerText = `Lvl ${level} (${xp}/${xpToNext})`;
      document.getElementById("gold-val").innerText = gold;
      document.getElementById("weapon-val").innerText = equippedWeapon ? `${armor} Arm / ${equippedWeapon.name}` : `${armor} Arm / Unarmed`;
      document.getElementById("floor-val").innerText = `${currentFloor} / ${isEndless ? 'Endless' : '20'}`;
      document.getElementById("skill-val").innerText = skillUsed ? "Used" : "Ready";

      document.getElementById("run-btn").disabled = retreatCount >= maxRetreats || roomEncounters.length < 4;
      document.getElementById("ability-btn").disabled = skillUsed || heroClass === "Rogue";

      const grid = document.getElementById("dungeon-room");
      grid.innerHTML = "";
      roomEncounters.forEach((enc, idx) => {
        const el = document.createElement("div");
        el.className = `encounter-node ${enc.nodeClass}`;
        el.onclick = () => interact(idx);
        let desc = "";
        if (enc.type === "Enemy" || enc.type === "Boss") desc = `Dmg: ${enc.value} | XP: +${enc.xpReward}`;
        else if (enc.type === "Weapon") desc = `Power: ${enc.power} (${enc.durability} Uses)`;
        else if (enc.type === "Shrine") desc = `Restores +${enc.value} HP`;
        else if (enc.type === "Fountain") desc = `Full Heal to ${maxHealth} HP`;
        else if (enc.type === "Treasure") desc = `Gold: +${enc.goldReward}`;
        else if (enc.type === "Armory") desc = `+${enc.armorBoost} Permanent Armor`;
        else if (enc.type === "Curse" || enc.type === "Mimic") desc = `Trap! -${enc.value} HP | +${enc.goldReward} Gold`;

        el.innerHTML = `<div class="node-title">${enc.title}</div><div class="node-desc">${desc}</div>`;
        grid.appendChild(el);
      });
    }

    function saveState() {
      const s = { health, maxHealth, level, xp, xpToNext, gold, armor, currentFloor, isEndless, equippedWeapon, roomEncounters, heroClass, skillUsed, retreatCount, godMode };
      localStorage.setItem("scoundrel_rpg_savestate", JSON.stringify(s));
    }

    function loadState() {
      const s = localStorage.getItem("scoundrel_rpg_savestate");
      if (s) {
        const parsed = JSON.parse(s);
        Object.assign(window, parsed);
        updateUI();
      } else {
        initGame();
      }
    }

    // Modal Listeners
    document.getElementById("start-btn").onclick = initGame;
    document.getElementById("run-btn").onclick = retreat;
    document.getElementById("ability-btn").onclick = useSkill;
    document.getElementById("open-cloud-btn").onclick = () => document.getElementById("cloud-modal").style.display = "flex";
    document.getElementById("close-cloud-btn").onclick = () => document.getElementById("cloud-modal").style.display = "none";
    document.getElementById("open-leaderboard-btn").onclick = openLeaderboard;
    document.getElementById("close-leaderboard-btn").onclick = () => document.getElementById("leaderboard-modal").style.display = "none";
    document.getElementById("close-shop-btn").onclick = closeShop;
    document.getElementById("close-cheat-btn").onclick = () => document.getElementById("cheat-modal").style.display = "none";

    loadState();
  </script>
</body>
</html>
